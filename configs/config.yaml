# ==================================================================
# 量化交易引擎 v2 —— 参数总配置
# 原则：模型管决策（品种+方向），代码管一切数字（价/量/SL/TP/杠杆）
# 10-06 18:5x 清掉全部旧世代参数留档（SL1.5%/SL0.8%、TP对面轨/1.5%、
#   risk_cap_pct 1%、floor 5%、分批 0.4、keep_r 0.8、arm 0.40%、be_arm 0.20%
#   及全部「历史依据留档」实测表）。历史依据看 git 与 memory 日志。
# ==================================================================

runtime_dir: runtime          # 状态文件目录
log_dir: logs                 # 日志目录

universe:                     # 交易池（Gate USDT 永续），14 个
  - BTC_USDT
  - ETH_USDT
  - DOGE_USDT
  - SOL_USDT
  - XRP_USDT
  - ZEC_USDT
  - TSLA_USDT
  - SNDK_USDT
  - SKHYNIX_USDT
  - BNB_USDT
  - HYPE_USDT
  - ADA_USDT
  - LINK_USDT
  # 🔴 SUI_USDT 剔除（10-07 用户令）：其维持保证金率 1.00% ⇒ 强平距 = 1/lev − 1.00%，
  #   在 30x 下仅 **2.333%**，而 liq_guard(×0.6) 把 SL 上限压到 1.40% —— 仍容得下，
  #   但它与 TP 距离 1.0% 的**比值最差**（SL 顶到 1.40% 时盈亏比仅 0.71），
  #   且距 1.0% 的 TP 只剩 1.33pp 缓冲。故仍留在池外，回退 = 加回本行。
  # 已退池（存量仓由 guard 管到底，不再新开）：XAU_USDT / XAG_USDT / TRX_USDT
  #   ⚠ 退池只影响「模型不再看到/不再新开」；guard 逐仓读交易所 positions、
  #     **不读 universe** → 存量仓的 SL/TP 不会被撤。
  #     唯一副作用：`_watch()` 不再为该品种采行情快照（看板少一行价）。

# ---- 决策节奏 ----
hf_interval_s: 60             # 高频决策轮：每 60 秒一轮
guard_interval_s: 2           # 止损跟随 + 动态止盈：2 秒一轮（保命机制不降频）
guard_heavy_every: 30         # 重活（幽灵单巡检/保证金守护/孤儿兜底）每 30 轮=60 秒一次
                              # ⚠ 必须与 guard_interval_s 配套：重轮要打 7 次
                              #   has_price_order（≈4.5s/轮），间隔越密重活越频繁。
watch_interval_s: 2           # 行情快照刷新

# ---- 布林带战法（唯一战法，1H 高频）----
# 🔴 10-07 02:2x 用户令：决策周期 15m → 1H（连带 timeout_min 240）。依据：
#   · 15m 候选 4 天全样本 30 组 (SL,TP) 无一组显著为正；1H 候选分侧后
#     **多头 +0.285%±0.124%（t≈2.3）／空头 −0.280%±0.090%（t≈−3.1）**，
#     空头已被 suppress_short_cand 压制 → 只吃正边际那一侧。
#   · 1H 单根振幅 ≈0.77%（15m ≈0.38%），故 SL 必须同步放宽到 2.0%
#     （≈2.6 根 bar 的生存空间，与 15m 的 SL1.0% 等价）。
#   · SL 放宽后在 50x 下**强平距离会小于 SL**（SUI 50x 强平距仅 1.00%，
#     SL1.0% 已是死单 → 即 10-07 强平病根）→ lev 50 → **20**
#     （20x 强平距 4.00~4.17%，SL2.0% 有 2 倍余量，liq_guard×0.6 全池通过）。
boll:
  n: 20                       # 均线窗口
  k: 2.0                      # 标准差倍数
  hf_tf_min: 60               # 高频周期（分钟）—— 10-07 02:2x 用户令 15→60
  cand_ttl_bars: 4            # 候选有效期（bar 数），过期作废
  seq_gap_bars: 6             # 触轨序列断档重置（bar 数）
  deep_atr: 2.0               # 深砸阈值：实体穿轨 ≥2×ATR 记衰竭
  flat_range: 0.25            # 中轨走平：近4根中轨极差 ≤0.25×ATR（区间市）
  # ⚠ sl_band_buf_pct **必须保留**：10-03 22:1x 起被 compute_tp 复用为
  #   「TP 防贴轨缓冲」（语义已从 SL 侧变成 TP 侧，仍在生效）。
  sl_band_buf_pct: 0.0005     # TP 防贴轨缓冲 0.05%（替代原 floor/ceil 取整，修低价品种 bug）
  # ---- 上轨空单候选压制（10-07 用户令「给候选生成器加过滤 + 候选反向提示做空」）----
  # 用户原方案是「阴跌不接下轨 + 把 long 候选反手做空」——**离线回放否决，未采纳**：
  #   · 阴跌判据 = 中轨 8 根累计下行 ≥1.0×ATR15 且 收盘带内位置 ≤0.35。
  #   · 14 品种 × 400 根 15m（10-02 21:45~10-07 01:30，long 候选 315 / short 候选 460，
  #     SL1.0%/TP1.2%，前视 8 根，同根双触按 SL 计）：
  #       阴跌中的 long 候选反而是**全样本最好**的一批：n=33 期望 +0.375%、胜率 81.8%
  #       （seq/wm 子集 n=12 期望 +0.514%、胜率 91.7%）→ 反手做空 = 把最好的信号打成最差的。
  #       36 组 (回看根数, 斜率, 位置) 参数**全部**同向：反手 = 原版做多的镜像，必然反向。
  #       上一轮亏损时段 10-06 18:00→10-07 02:00 的 40 个 long 候选**判为阴跌的 = 0**
  #       （那 6.5h 全池等权只走 −0.25%）→ 该过滤器在真正亏钱时根本不会触发。
  #   · 另：把 long 候选按路径拆，唯一稳定为负的 first(首触直开) n=68 −0.086% 也与阴跌无关。
  #
  # 数据指向的其实是**另一侧**：上轨产出的 short 候选才是系统性负边际 ——
  #   · 全部 short 候选 n=460 期望 −0.061%、胜率 40.2%（保本线 45.5%），z≈−2.26；
  #     各路径/各位置切片**无一切片为正**（seq n=88 −0.143%／wm n=40 −0.104%／first n=89 −0.092%）。
  #   · 同期大盘等权 **−0.74%**（中位 −1.52%，仅 5/14 上涨）—— 下跌市里空单还亏，说明是
  #     负边际，不是被上行漂移拖累。
  #   · 实盘同向：short 且 sig=cand_* 的 4 笔 −0.5146U 胜率 50%；上一轮那批「高胜率空单」
  #     全部来自 flip(翻仓，+0.755U/100%) 和 model 自主(71.4%)，与候选无关。
  #
  # 处置 = **压制**（不产出 short 候选），不是反手做多：
  #   · 反手做多净期望 −0.009%/笔（毛 +0.061% − 实结往返费 0.070%）仍为负；压制 = 0，更优；
  #   · 更关键：反手会把「双顶成立(legs.m.ok)／连续假突破(seq)」直接翻成做多，与提示词
  #     【形态素材】里 legs.m／seq 的既有定义正面冲突；压制不产生任何语义矛盾。
  #   · 压制只影响 scan() 往 brief 里挂不挂 candidate，**不动状态机内部候选**，因此不改变
  #     D/E 路径 `if not self.cand` 的传播；模型仍可用 fake_up_n≥2／legs.ok／deep 自行点名
  #     做空（【形态素材】口径原样）→ 属"证据瘦身"，不是决策护栏。
  # 回退：本键置 false 即逐字节恢复原行为。
  suppress_short_cand: true   # 🔴 10-07 01:5x 上线

# ---- 行情定性（10-07 用户令改用收网 Seine 口径）----
# 判定（与 seine/strategy/regime.py 逐根同源，指标见 core/indicators.py 序列版）：
#   bw = (up − dn) / mid
#   regime = range
#   if adx >= adx_trend:   regime = up_trend if +DI > −DI else down_trend
#   elif bw > high_vol_bw: regime = high_vol
#   bw < bw_min → regime = low_vol 且 meaningful=False（轨道不具参考性）
# ⚠ 这是**行情定性**、不是决策护栏：只随 brief 喂模型，代码不据它拒开、不改方向
#   （沿用 10-02 用户令「不要加护栏」）。与「布林候选」并存——BollStateMachine 的
#   形态候选与全部布林标注字段（bw_pct/walk/close_out…）都不受影响。
regime:
  adx_trend: 25               # ADX≥此值判为趋势（up_trend/down_trend，方向由 ±DI 定）
  high_vol_bw: 0.03           # ADX 不足但带宽 > 此值 → high_vol（波动释放、方向未定）
  bw_min: 0.004               # 带宽低于此值 → 轨道不具参考（meaningful=False）

# ---- 止盈止损（SL 2.0% / TP 固定 3.0%）----
exit:
  sl_opposite_band: false     # ❌ 已废止：置 false 防旧逻辑复活。代码仅兼容读取。
  tp_opposite_band: false     # ❌ 本键**代码从未读取**（compute_tp 无此分支），
                              #   纯留档位，勿以为改它有效。
  tp_fixed_pct: 0.010         # ✅ TP 距离 = 入场价 × 1.0%（固定，全品种统一）
                              #   🔴 10-07 用户令：TP = 「交易所显示盈利 X% 就平仓」。
                              #   ROE = 价格变动 × 杠杆 ⇒ **30x 下 1.0% ≡ ROE 30%**。
                              #   （10-07 16:2x 前是 50x，同一个 1.0% ≡ ROE 50%：
                              #     降到 30x 后本键**无需改动**即自动变成用户要的 30%。）
                              #   置 0 可一键退回「对面轨 / 2×ATR / tp_floor_pct」旧口径。
                              #   ⚠ 若日后改 lev_default，务必回来重算 ROE（= 本值 × 杠杆）。
  tp_floor_pct: 0.005         # 仅 tp_fixed_pct=0 时生效：对面轨与 2×ATR 都无效的占位
  tp_far_atr: 2.0             # 仅 tp_fixed_pct=0 时生效：对面轨无效时的二级兜底
  # 止损：唯一口径 = 固定百分比。面轨与 ATR 两套旧口径均已废止
  #   （面轨距离随带宽乱跳 0.1%~2%+，无法统计归因；ATR 口径窄带品种比固定值还近）。
  # 🔴 10-07 16:2x 用户令「杠杆统一 30 倍」连带 SL 0.68% → **1.20%**。
  #   这不是「最优」值，是 liq_guard(×0.6) 压出来的**上限内取值**：
  #   约束 (1/lev − mr) × 0.6 ≥ SL距/px。30x 下两档 mr 的强平距离都远大于 SL：
  #     · mr=0.8333%（DOGE/ZEC/SNDK/SKHYNIX/HYPE 基础档）→ 强平距 2.500% → 上限 1.500%
  #     · mr=1.0000%（**实测持仓档**，ETH 实盘 5 张时 Gate 把档位从 0.30% 抬到 1.00%）
  #       → 强平距 2.333% → 上限 1.400%
  #   取 1.20% ⇒ 对上限余量 0.30pp(基础档) / **0.20pp(持仓档)**。
  #   ⚠️ **口径陷阱（务必知情）**：`RiskManager.check_open` 的 liq_guard 校验读
  #   `ex.spec()` 的**基础档** mr，而真实强平按**持仓档** mr（Gate 按仓位大小抬档）。
  #   ⇒ **「校验通过」≠「实际安全」**，定 SL 必须按持仓档那档算余量。
  #   ⚠️ 代价：TP 固定 1.0% 时，名义盈亏比 1.47 → **0.83**（保本线 45.5% → **54.6%**）。
  #   止损频率下降，但**单笔亏损从 0.61U 升到 1.08U**（3U 保证金 × 36% ROE）。
  #   改 SL 前后都要连带重测 TP 口径（两者强耦合，见 risk/manager.py::compute_tp）。
  sl_min_pct: 0.012           # 止损距离 = 入场价 × 1.20%（固定，全品种统一）
                              #   10-07 02:2x 随周期 1H 联动（1H 单根振幅 ≈0.77%，
                              #   SL2.0% ≈2.6 根 bar 生存空间，对齐 15m 时代的 SL1.0%）。
                              #   名义 R:R = TP 1.0% / SL 1.2% = **0.83**（10-07 16:2x 前
                              #   SL 0.68% 时是 1.47）。
                              # ⚠ 连带（改本值前先看）：保证金守护目标 = 1.2 × 本值
                              #   （现 **1.44%**，30x 实际强平距 ≥2.333% → 不触发追加保证金，
                              #   故 3U 保证金名额定得住）；单仓名义 = risk_cap_pct ÷ 本值
                              #   = 3.2% / 1.2% = **2.67×权益**；名义风险 = 90U × 1.2%
                              #   = 1.08U = 权益 2.77%（risk_cap 3.2% ✅ 未触发，但余量不大）。

# ---- 仓位与杠杆（代码全权，模型禁止输出）----
sizing:
  fixed_margin_u: 3.0         # 🔴 10-07 用户令：**统一 3U 保证金**开仓，不再随权益浮动。
                              #   size = 3U × lev ÷ (quanto_multiplier × px)，下限 1 张。
                              #   ⚠ 张数是整数 ⇒ 做不到精确 3U：实测 SOL 只开 1 张(2.37U,
                              #   −21%)、ETH 5 张(2.61U,−13%)、LINK 10 张(2.73U,−9%)，
                              #   其余品种多在 ±3%。这是合约粒度决定的，不是 bug。
                              #   名义帽/风险帽仍保留作**上界保护**（3U×50=150U 均不触发）。
  margin_min_pct: 0.05        # 开仓保证金硬下限：权益 5%（fixed_margin_u>0 时降为兜底）
  margin_max_pct: 0.105       # 硬上限：权益 10.5%
                              #   🔴 10-07 16:3x 用户令「放宽保证金上限」（8% → 10.5%）：
                              #     30x 下 SOL 1 张保证金 3.95U = 权益 **10.02%** 装不进旧 8%。
                              #   ⚠ 这两个 cap 在 `fixed_margin_u>0` 时**只当上界保护**用
                              #     （`check_open` 末尾按结果反查，占比超本值即拒开），
                              #     正常路径的定仓由 `fixed_margin_u=3U` 决定。
  wr_tier_high: 0.65          # ⚠ 死代码：仓位与模型 win_rate 无关，本档位不读取
  wr_tier_mid: 0.55           # ⚠ 同上，死代码
  notional_cap_x: 4.5         # 单笔名义价值帽 = 权益 × 4.5（@39.4U = 177.3U）
                              #   30x 下 3U 保证金 ⇒ 名义 90U，正常远不触发；
                              #   SOL 1 张 118.4U 也在帽内（本帽不是 SOL 被拒的原因）。
                              #   连带必改：保证金档 × 杠杆会顶到本帽，改一头须改另一头，
                              #   否则仓位被名义帽原地钳回、保证金档位等于没改。
  lev_default: 30             # 默认杠杆（按合约 leverage_max 钳制）；全池统一
                              #   🔴 10-07 16:2x 用户令「统一 30 倍」（此前 50，02:2x 曾到 20）。
                              #   ✅ 30x 的直接好处：名义 = 3U×30 = 90U（原 150U），
                              #   手续费按名义收 ⇒ taker 往返 0.09U，**占 TP 盈利(0.9U) 的
                              #   10.0%**（与 50x 占比相同，都是 10%；真正变的是**金额**）。
                              #   ⚠ 强平距离随杠杆下降而拉开：30x 下 ≥2.333%（持仓档口径），
                              #   相对 50x 的 1.167% 宽了 1 倍 ⇒ **这才是能放宽 SL 的原因**。
                              #   ⚠ 与 SL 强绑定：降杠杆必须同时放宽 SL（本轮 0.68%→1.20%），
                              #   否则 SL 相对强平距离过近、止损会被噪音反复扫掉。
                              #   ROE 口径下**杠杆不改变盈亏金额**（改的是名义与费金额）。
  # ⚠ 勿再误解：**杠杆不改变费率**。费率按【名义额】收，名义 = 保证金 × 杠杆
  #   → 降杠杆只是在同保证金下缩小仓位、手续费同比例下降，**不是"费率变低"**。
  #   真正的费率变量只有 maker 0.02% / taker 0.05%（账户实测，正费不返佣）。
  lev_override: {}            # 空 = 全池统一用 lev_default
  lev_min_sl: 10              # 对面轨 SL 反推出的杠杆低于此值才收紧 SL（兜底，防杠杆过低）
  risk_cap_pct: 0.037         # 单笔最大风险（名义 × SL 距离）≤ 权益 3.7%
                              #   🔴 10-07 16:3x 用户令「放宽风险帽」（3.2% → 3.7%），
                              #     起因：30x + SL 1.2% 下 SOL 1 张风险 1.421U = 权益 3.607%
                              #     装不进旧帽 3.2%（1.261U）而被拒开。用户选择放帽而非弃用 SOL。
                              #   连带：单仓名义 = 本值 ÷ sl_min_pct = 3.7% / 1.2% = **3.08×权益**
                              #   ⚠ 本值是「固定 3U 保证金」之外的**第二道缩仓器**：3U 算出的
                              #     张数若使风险超本值则缩仓；单张已超帽则**拒开**（fail-closed）。
                              #   ⚠ 副作用：9 仓满配时总风险敞口 ≈ 8×1.08U + 1.42U ≈ 10.1U
                              #     = 权益 **25.6%**（@39.4U）
  margin_mode: isolated       # 逐仓

# ---- 仓名额 ----
limits:
  max_hf_positions: 9         # 高频仓并发上限（09-30 3→5、10-04 5→7、10-05 7→9）

# ---- 高频金字塔加仓（10-02 19:37 用户拍板上线）----
hf_add:
  enabled: false              # 🔴 10-07 用户令「统一 3U 开仓」：加仓停用（否则仓位会被
                              #   加仓撑破 3U 口径）。
  max_adds: 1                 # 最多追加 1 档（业界 3 档；高频只吃回归，不吃趋势）
  spacing_atr: 1.0            # 加仓间距 = 1.0×ATR15（业界 0.5~1.0 取上限）
  gain_atr_min: 1.0           # 前提：已有浮盈 ≥ 1.0×ATR 才允许加仓（严禁亏损加码）
  size_ratio: 0.5             # 加仓张数 = 首仓 × 0.5（金字塔递减）
  risk_mult: 2.0              # 加仓后总风险 ≤ 单笔计划风险 ×2（比业界 3× 更严）
  cooldown_s: 900             # 兜底冷却 15 分钟（=1 根 15m K 线）
  recalc_avg_sl: true         # 加仓后按新均价重挂统一 SL

# ---- 候选即单（用户 09-30 07:39 拍板：机器候选直接开，不等模型确认）----
# 开仓权铁令（08:00）：开仓只能由模型决策（品种+方向），代码自动开仓器已删除

# ---- 护栏 ----
# （用户 09-30 02:06 拍板撤销：同向止损锁、周末禁开、恐慌平仓拦截、平仓投票——
#   模型平仓意图直接执行，数字护栏不变）
guards:
  liq_guard_ratio: 0.6        # 爆仓护栏：SL 距入场 ≤ 强平距离×60%
  liq_safe_fallback: 0.25     # 查不到强平价时的兜底强平距离（逐仓高杠杆口径）
  # 保证金守护：唯一职责 = 爆仓点必须晚于止损点。
  #   `target = max(margin_guard_sl_x × sl_dist, entry × margin_guard_floor)`
  #   现 = 1.2 × **该仓当前止损距离** = **1.2%**。全部由代码就地算，无写死数字：
  #   · 强平距离优先读交易所自算的 `liq_price`（真实口径）；
  #     缺失/为 0 才回退 `margin/(size×mult) − mr×entry`。
  #   · `mr`（维持保证金率）由 `engine._maint_rate()` **逐仓动态取**，三级优先：
  #     ① 持仓行自带 `maintenance_rate`（= **该仓实际适用风险档**，Gate 会随仓位
  #        大小把档位抬上去；实测选 50x 时 DOGE/SKHYNIX/HYPE 基础档 0.83% vs
  #        持仓档 **1.20%**，TSLA/BNB 0.50/0.66% vs **1.00%**）；
  #     ② 合约基础档 `ex.spec(contract)["maintenance_rate"]`；
  #     ③ 下面 `margin_guard_mr_fallback`（配不到才用）。
  #     ⚠ 旧版 engine 此处写死 `mr = 0.005`，实测**高估强平距离** → 真实强平
  #       已进 SL 之内也不报警，正好废掉本闸唯一的职责。
  #   · 回退：sl_x→3 + floor→0.05 = 恢复 5% 口径；两者同置 0 = 关闭本闸。
  margin_guard_sl_x: 1.2      # 保证金守护：目标强平距离 = 1.2 × 该仓当前 SL 距离
  margin_guard_floor: 0       # 0 = 不用绝对值地板
  # 以下 4 项原为 engine.py 里的裸常数，10-06 提到配置。
  #   **默认值与旧硬编码值完全相同 ⇒ 零行为变化**，只是从「改不了」变成「可调」。
  margin_guard_mr_fallback: 0.005     # 持仓档/合约档都取不到时的兜底（正常路径永不读）
  margin_guard_cap_notional_pct: 0.2  # 守护后总保证金 ≤ 名义 × 此值（防公式异常无限灌注）
  margin_guard_cap_equity_pct: 0.15   # 且 ≤ 权益 × 此值
  margin_guard_min_add_u: 0.5         # 单次追加额低于此值不值得动（单位 U）
  min_tp_pct: 0.002           # TP 距离硬下限 0.2%（≈2×往返手续费），杜绝「连手续费都不够」的窄带单
  entry_post_only: true       # 开仓先挂 maker 单（多挂买一/空挂卖一，poc 保证返佣）
  entry_po_timeout_s: 5       #   挂单超时秒数：未成交撤单、已成交部分保留、剩余市价补齐
  # ---- 再入场锚点（10-06 用户拍板：同品种同方向连续开单，**全由代码负责**）----
  #   场景：上一单被动态止盈平掉后价格已走远，再按现价开同方向 = 追价。
  reentry_guard_enabled: true   # 一键回退：false = 完全不查锚点（恢复旧行为）
  reentry_chase_tol_pct: 0.001  # 容忍带 0.10%：现价劣于锚点不超过此值仍照常挂盘口
  reentry_window_min: 480       # 上次平仓超过此时长（8 小时）→ 不再作锚，直接放行。
                                #   ⚠ **宜宽不宜紧**：危害与间隔无关，设它是为了挡住
                                #     `_reentry_anchor` 扫「昨天+今天」两个 journal 带来的
                                #     **跨天陈旧锚点**（语义防呆）。
  profit_cover_pct: 0.001     # 主动平仓需浮盈 ≥ 现价 0.1%（覆盖往返成本；仅限浮盈侧）
  loss_cooldown_min: 0        # 亏后冷却：0 = 关闭（与「盈利加仓」冷却期语义冲突，故停用）
  # ==================== 🔴 10-09 用户令：机械护盈段整体删除 ====================
  #   被删的六段（原先全部是 `false`，即"已关闭但代码还留着"）：
  #     · be_enabled            A 段保本护栏
  #     · trail_enabled         B 段阶梯追踪
  #     · trail_cont_enabled    C 段止损连续跟随
  #     · tp_trail_enabled      E 段动态止盈（含保本兜底 / 动态绳）
  #     · tp_split_enabled      分批止盈
  #     · time_stop.enabled     时间止损
  #   连同它们的全部参数键（`trail_*` / `be_*` / `tp_trail_*` / `tp_split_*` /
  #   `time_stop.*` / `sl_side_buf_pct`）一并从 config 与 engine / risk / exit_agent /
  #   server 删除。**引擎侧的 500 行死分支也同步删掉了**（见 engine._guard）。
  #   为什么删而不是留着：这些段 10-07 起就全关，却一直被当成"随时能开回来"的备份
  #     —— 10-09 复盘时，一张「六道护盈全关」的表被误读成"系统坏了"，而真正在跑的
  #     出场链路（交易所固定 SL/TP + 模型持仓管理）反而没人看。留着 = 持续制造误读。
  #   出场现在只有三条路：
  #     ① 交易所侧固定 SL / TP 条件单（开仓即挂，`exit.sl_min_pct` / `tp_fixed_pct`）
  #     ② D 段 `tp_fill_fallback`：TP 触发未成交 → 市价兜底；TP 单丢失未到价 → 补挂
  #     ③ 持仓管理模型主动平仓（`exit_review`，含【平仓五条件】与停滞锁盈）
  #   ⚠ 要重新引入"机械锁盈"，请基于 10-09 的回测结论重建，不要直接照搬旧参数 ——
  #     见下方 `exit_review.stall_lock_*` 的注释：武装线低于 0.8×止盈距离的回吐锁盈，
  #     在 68 笔已平仓样本上**全部是净亏**（最好的也只有 +0.04U）。

  # ---- TP 距离下限（10-02 拍板；10-09 随机械护盈段一并简化）----
  #   止盈必须「付得起往返手续费 + 留下一点净利」才有意义。开仓前**还没有实单**、
  #   拿不到该单真实 fee_rt，故用下面两个保守常数估：
  tp_fee_ref_pct: 0.0012      # 往返手续费保守估计 = 实测双 taker 0.0010 × 1.2（刻意留 20% 缓冲）
  tp_min_net_pct: 0.0015      # 落袋净利下限
  #   → 新下限 = max(min_tp_pct 0.2%, 0.0012 + 0.0015) = **0.27%**
  #   ⚠ 与删前**不完全相同**（这点必须写清楚，别当成零变化）：
  #     旧公式 = max(min_tp_pct, 锁线 + 绳子 + 落袋净利下限)，其中「绳子」=
  #     `dyn_rope` 给出的 `峰值净利 × (1−keep_r 0.85)`。它随 TP 距离浮动：
  #       tp_dist 0.5% → 旧下限 0.327% ／ 1.0% → 0.402% ／ 2.0% → 0.552%
  #     那根绳子存在的唯一理由是「给止盈线程留出提前落袋的空间」。机械护盈段
  #     整体删除后**没有任何线程会提前落袋**，该项自然消失 ⇒ 下限变成常数 0.27%。
  #   ✅ 对现役配置**零影响**：`tp_fixed_pct = 1.0%` 远高于两个口径（1.0% > 0.402%
  #     > 0.27%），两种算法都不会拒开任何单。只有当将来把 TP 收到 0.4% 以下时，
  #     新旧口径才会出现差异（新口径更宽松，允许更窄的止盈）。
  tp_fill_fallback: true      # D 止盈兜底：TP 触发未成交 → 市价兜底；TP 单丢失未到价 → 补挂
  # ---- 峰值/谷值遥测（10-08 用户令「让 AI 和看板看见浮盈」）----
  #   🔴 为什么必须单独有这一段：10-07 把全部机械护盈段关掉之后，**没有任何一段
  #   还在更新 meta.peak / tp_peak** → 峰值被永久冻结在开仓价上。后果（10-08 实测）：
  #     · 看板「MFE 最大浮盈 / 峰值出现时刻 / 峰值价」全是 0 / 入场价；
  #     · exit 线程喂模型的 mfe_pct / give_back_pct **恒为 0** →
  #       系统提示词的【平仓条件②「顺向涨势已吐光」永远不可能命中】；
  #     · journal.mark 的 dd_from_peak_pct 退化成「距入场价的涨跌幅」。
  #   本开关**只做遥测**（见 engine.py「峰值/谷值维护」段）：不撤单、不市价平、
  #   不推 SL、不挂 maker 单 —— 它不会让任何一单提前出场，只是让 AI 与看板
  #   看得见「这单曾经赚到过多少」。
  #   ⚠ 10-09 起它是**唯一**维护峰谷的地方（机械护盈段已整体删除），因此本段
  #     与 `peak_backfill_on_start` 都不能关：关掉 = 模型看不到浮盈回撤，
  #     【平仓五条件】里的 ②a/②b 与停滞锁盈（⑤）会全部失效。
  #   回退：置 false = 逐字节回到「峰值冻结」旧行为（AI 重新变成瞎子）。
  peak_track_enabled: true

  # ---- 启动峰值回填（10-08 用户令「修」）----
  #   为什么需要：无条件遥测（上面那个开关）只能从**它上线那一刻**开始记峰。对于
  #     · 它上线之前就开着的仓、以及
  #     · 每次引擎重启之前累积的峰谷
  #   真实峰谷都不在 meta 里 → exit 线程会把"其实走起来过"的单误判成"没走起来"。
  #   实证：SNDK 多 10-08 08:13 开仓，真实峰值 +0.543U（0.52R），而引擎平仓记录里
  #   peak=1704.98 / mfe=0.030% → 模型全程以为它没赚过，最后被 SL 打掉 −1.11U。
  #   本开关打开时，引擎**启动那一下**会读 journal 的历史 mark 事件（每档含真实 px），
  #   把每笔在持仓的峰/谷补进 open_meta，再起线程。纯数据回填：不撤单、不下单、
  #   不做任何出场动作。回退：置 false = 不读不回填（逐字节回到旧行为）。
  peak_backfill_on_start: true

  # ---- 幽灵状态清理（修「幽灵峰值被新仓继承」bug 的两个节流阀）----
  ghost_sweep_s: 60           # 「open_meta 有记录、交易所已无仓」的 key，每 N 秒扫一遍
                              #   （否则「同 key 平了又开」永不清理）
  ghost_meta_ttl_s: 900       # 幽灵记录保留期：查不到平仓行时最多留 N 秒（15 分钟）
  # ---- 孤儿仓兜底：检查频率（10-05 用户拍板脱离 heavy 门控）----
  # 🔴 **三个旋钮别混**：
  #      · ghost_sweep_s = 清理「有记录无仓」的周期（本地可判）
  #      · bare_cool_s   = 裸仓**补挂后**的冷却（防重复补挂）
  #      · orphan_check_s= 孤儿仓的**检查**周期 → 数值直接等于发现延迟
  #   孤儿仓 = 「meta 完好、但**交易所侧**的 SL 条件单被外部删了」，**本地无从得知**，
  #   只能问交易所 ⇒ 检查频率 = 发现延迟，没法既零成本又 2s 发现。
  #   本实现**一次 `list_price_orders()`（不带 contract）拿回全部挂单**后内存比对
  #   → 9 个仓 = **1 次 HTTP**，不是 9 次，故 10s 的成本可忽略。
  orphan_check_s: 10          # 孤儿仓 SL 单丢失的检查周期（秒）= 发现延迟上限
  bare_cool_s: 60             # 裸仓补挂后的冷却（秒）。**首次发现仍是即时的**，
                              #   只有补挂动作本身被冷却，与 orphan_check_s 互不干扰。

# ---- 翻仓事务（一个品种一个仓位 + 反向翻仓）----
# 事故背景：Gate 是双向持仓模式（dual_side=dual_long/dual_short），同 contract
#   可多空并存；而 `_try_open` 只用 `contract|side` 做 key → 反向腿不进判断
#   → 直接开出一笔反向仓（10-05 实盘 SNDK / HYPE 双开）。
# 修法（**不是决策护栏**）：开仓决策照旧（品种+方向 100% 由模型给），
#   代码只在下单前把「同contract 已存在的反向腿」收敛掉：
#   F1 开新 → F2 挂新 SL/TP → F3 平旧 → F4 落账（删旧 key + 写新 key）。
#   平旧失败 → 回滚平新腿 → **不自动重试、不记仇、不设冷却**。
flip:
  enabled: false              # 🔴 10-07 用户令「其他盈利方式全关」：翻仓链路停用。
                              #   关闭后「翻仓旧腿不落账/回滚失保护」等 P0 随之消失
                              #   （不再有旧腿），同品种反向单改为「等到无反向仓再开」。
  timeout_s: 30               # 窗口期上限。超期只🚨 告警，不自动平任何一边
  close_old_retry_max: 3      # F3 平旧腿的重试上限
  cause_ttl_s: 120            # 待认领平仓成因（_CAUSE）的存活期，过期由 guard 清
  guard_freeze: true          # 冻结闸：翻仓窗口期 guard 跳过该 contract 的全部退出类动作
  audit_on_start: true        # 启动时做一次双开审计：只告警 + 写 journal，**不自动收敛**
  rollback_freeze_s: 3600     # 回滚失败后的冻结时长 1 小时（无限期会让两腿彻底裸奔）
  # ---- 翻仓节流（用户拍板方案 A：**执行层节流，不是决策护栏**）----
  #   决策权仍 100% 归模型（照样能改主意），代码只在 `_try_open` 进入 `_flip`
  #   **之前**拦两类坏形态。两键均默认 0 = 该闸关闭 → **逐字节回到加闸前行为**。
  min_interval_s: 120         # 闸1：距旧腿开仓不足 N 秒 → 跳过本次翻仓（拦「2~3 分钟打脸」）
  max_chase_pct: 0            # 闸2：反手价越过旧腿入场价 N%（多向上 / 空向下）→ 跳过
                              #   ⚠ 现留 0：单跳偏离实测最大仅 0.86%，**拦不到累计追高**；
                              #     要拦需另加锚定价口径闸。

# ---- 持仓管理（平仓决策，10-07 用户令新增）----
# 「平仓线程」= 独立第五线程（engine.py 的 exit_loop），只做一件事：
#   把**当前账内持仓**（只传持仓品种，不传全池）连同仓位信息喂给模型，让模型
#   自己判断 hold / close；代码收到 close 信号 → 市价平 + 撤本方向条件单。
#
# 与开仓决策的分工（互不越界）：
#   · hf 线程   = 开仓决策（全池标注 → open/hold），**不再输出 close**；
#   · exit 线程 = 持仓管理（只持仓品种 → close/hold），**不能开仓**。
#
# 🔴 平仓门槛（10-07 用户令「不要轻易给平仓信号，只有确定反转或确认信号才平」）：
#   提示词里 hold 是默认答案，close 必须**逐条命中【平仓三条件】之一**——
#     ① 反转已确认：regime 翻到持仓反面 + m1h_mom 反号 + 价格站到中轨另一侧（三条齐）
#     ② 顺向涨势吐光：mfe≥0.5% 且 回吐≥2/3 且 短周期动能反向
#     ③ 浮亏且结构已坏：亏损 + 动能反号 + band_pos 越过中轨
#   都不命中 → hold。配合下面 exit 侧的固定 SL/TP 兜底，最大亏损仍锁在
#   `sl_min_pct`（**现役 1.20%**；10-07 16:2x 前是 0.68%）。
#
# 🔴 交易所那两条固定 SL/TP 条件单**保留不动**，作为硬兜底：
#   模型不响应/超时/解析失败时，最大亏损仍被 `sl_min_pct` 锁死（**现 1.20%**）。
#   模型平仓走 `executor.market_close`，它内部会先撤**本方向**的 SL/TP 再市价平，
#   所以不会出现「模型平完条件单又触发」的重复平仓。
#
# 归因：模型平仓的订单 text = `t-v2-mclose` → `close_cause=model_close`
#   （**独立成因**，不与 guard_take / sl_tp 混算胜率与盈亏比）。
exit_review:
  enabled: true               # 总闸。false = 不调模型、不新增任何动作（逐字节回退）
  interval_s: 60              # 决策轮：与 hf 同频（用户 10-07 拍板 60s）
  max_tokens: 1024            # 9 个持仓逐条 hold/close + 理由，512 会截断
  timeout_s: 90
  max_close_per_round: 0      # 单轮最多平几个。**0 = 不限**（默认，把判断权全交模型）。
                              #   设 >0 只作「模型输出异常时的一次性减震」，不是方向判断。
  max_scan_age_s: 180         # scan.json（布林标注来源）超过此秒数则标注段标注为"不可用"，
                              #   **仍然会调模型**（仓位信息本身才是主要依据），不整轮中止。
  profit_cover_pct: 0.001     # 微利不平：浮盈在 (0, 0.1%) 之间不执行 close
                              #   （覆盖不了往返手续费，白交钱）。浮亏侧不受限。
                              #   置 0 = 关闭该判定，模型说平就平。
  brief_tail_lines: 200       # 决策流水 `runtime/exit_decisions.md` 落盘的行数上限（滚动保留）
  # ---- 停滞锁盈（⑤，10-09 用户令「让模型自己锁，但别影响能止盈的单子」）----
  #   背景：10-09 BTC 空 00:03 开 @81109，01:26 峰值 +0.90%（=0.83×止盈距离），
  #     02:16 吐光回成本，10:06 打固定止损 −1.06U。当日六道机械护盈（A/B/C/E/分批/
  #     时间止损）全关，唯一能救它的保本护栏也挂在 `tp_trail_enabled` 总闸下面。
  #   为什么不直接开回吐锁盈：68 笔已平仓全量回放（用 journal 的 mark 价格序列）
  #     显示 —— **47%（32/68）的单子最终走到止盈，且它们的峰值普遍卡在
  #     0.8~0.95×止盈距离**，与"会打损"的单子落在同一区间，回吐发生的那一刻
  #     两者特征无法区分。任何武装线 <0.8×TP 的回吐锁盈都是净亏：
  #       武装线 0.3×TP → 合计 −5.60U（砍掉 22 笔 TP 单，−14.72U）
  #       武装线 0.5×TP → 合计 −4.58U（砍 16 笔，−9.67U）
  #       武装线 0.6×TP → 合计 −2.35U（砍 12 笔，−6.93U）
  #       武装线 0.8×TP → 合计 +0.04U（砍 3 笔，−1.66U；救回 1 笔 +1.44U）
  #     这恰好印证 10-07 关掉动态绳的判断，也说明"不影响能止盈的单子"这个约束
  #     本身就是硬的：**能止盈的单和会打损的单，在回吐那一刻长得一样。**
  #   唯一"零误伤"的配置是**停滞锁盈**——把武装线抬到接近止盈，并额外要求
  #     "已经拿了很久还没兑现"：
  #       峰值 ≥ 0.80×止盈距离  且  持仓 ≥ 120 分钟  且  回吐 ≥ 70% 峰值  且  仍浮盈
  #     68 笔回放：只触发 1 次（就是 10-09 那单 BTC），+1.21U，**一刀没砍错**。
  #   阈值全部可调；回退 = `stall_lock_enabled: false`（逐字节回到"只有四条件"）。
  stall_lock_enabled: true
  stall_lock_peak_ratio: 0.8      # 峰值浮盈 ÷ 止盈距离 的下限（0.8 = 摸到止盈距离的八成）
  stall_lock_min_hold_min: 120    # 且已持仓 ≥ 此分钟数（给过机会、拖了太久）
  stall_lock_giveback_ratio: 0.7  # 且已回吐 ≥ 峰值的此比例

# ---- 模型（OpenAI 兼容 /chat/completions）----
llm:
  provider_env: CLOUD         # 读 .env 的 CLOUD_BASE_URL / CLOUD_API_KEY / CLOUD_MODEL
  temperature: 0.0            # 决策要确定性，不要随机性：temp>0.2 时同一份 brief
                              #   连调 3 次得 hold/open/open 三种答案 → 白交手续费。
  max_tokens: 1024            # ⚠ 512 会截断「输出含 checks 自检段」的 JSON → 解析失败；
                              #   10-08 加了 scan（逐品种判定）后每轮输出 +~400B，768 已吃到边缘，抬到 1024
  timeout_s: 90
  cooldown_base_s: 90         # 连续失败退避：90s 起，×失败次数，封顶 300s
  cooldown_max_s: 300
  reflect_model_env: REFLECT_MODEL   # 反思用更强模型（沿用同网关/key；空=不反思）
  max_lessons: 5              # 注入提示词的最近教训条数
  decisions_tail_lines: 600   # runtime/llm_decisions.md 滚动保留行数（10-08 加 scan 后
                              #   每轮 +~400B，而该文件此前**从不裁剪**、已达 1.0MB/4848 行）

# ---- 复盘迭代线程（第五线程）----
# 甲 行情分段进提示词 / 乙 影子参数只报告不切换（参数切换权在用户）
review:
  god_view_bars: 20          # 上帝视角回看：平仓后等 ≥5 根 15m 再判，最多看 20 根
  shadow_params:             # 影子参数组（并行统计，主轨道 n=20/k=2 永不动）
    - {n: 15, k: 2.0}
    - {n: 20, k: 2.0}
    - {n: 25, k: 2.2}
  lesson_min_ratio: 0.55     # 教训同类归并相似度阈值
